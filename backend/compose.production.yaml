# Usar después de apuntar el dominio al VPS. Solo Caddy expone puertos públicos.
services:
  caddy:
    image: caddy:2-alpine
    environment:
      NARRA_DOMAIN: ${NARRA_DOMAIN:?Configura el dominio de la API}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped
volumes:
  caddy-data:
  caddy-config:
