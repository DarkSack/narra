<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Narra · Revisión</title>
<style>
  :root { --bg:#FBF8F2; --card:#FFFFFF; --text:#1F1B16; --muted:#5F574C; --line:#E4DCCD; --accent:#8A5500; --on-accent:#FFFFFF; --danger:#B3261E; color-scheme:light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0F0E14; --card:#1B1A22; --text:#ECE6DA; --muted:#B4AC9F; --line:#2E2C38; --accent:#F2B45A; --on-accent:#2A1A00; --danger:#F2B8B5; } }
  * { box-sizing:border-box; }
  body { margin:0 auto; max-width:760px; padding:16px; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  h1 { font-size:1.4rem; margin:0; } h2 { font-size:1.15rem; margin:28px 0 4px; } h3 { font-size:1.05rem; margin:0 0 4px; overflow-wrap:anywhere; }
  .count { color:var(--muted); font-weight:normal; }
  .hint, .meta, .empty, #status { color:var(--muted); font-size:.9rem; margin:4px 0; }
  article { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin:12px 0; }
  article p { overflow-wrap:anywhere; }
  .reason { font-style:italic; }
  ul { margin:4px 0 8px; padding-left:20px; }
  label { display:flex; gap:8px; align-items:center; margin:12px 0 4px; }
  input[type=checkbox] { width:20px; height:20px; accent-color:var(--accent); }
  .actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:8px; }
  button, .actions a { min-height:44px; padding:0 18px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--text); font:inherit; display:inline-flex; align-items:center; text-decoration:none; cursor:pointer; }
  button.primary { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  button.danger { color:var(--danger); border-color:var(--danger); }
  button:disabled { opacity:.45; cursor:default; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
</style>
<script src="panel.js" defer></script>
</head>
<body>
<header><h1>Narra · Revisión</h1><button id="refresh" type="button">Actualizar</button></header>
<p id="status" role="status" aria-live="polite"></p>
<section id="pending">
  <h2>Pendientes <span class="count"></span></h2>
  <p class="hint">Abre el PDF y revisa todas las páginas y el texto antes de aprobar. Al aprobar se vuelve a pasar el antivirus y el libro queda visible en el catálogo.</p>
  <div class="list"></div>
</section>
<section id="reported">
  <h2>Publicados con denuncias <span class="count"></span></h2>
  <p class="hint">Siguen en el catálogo: se retiran solos con 3 denuncias de cuentas con al menos 7 días.</p>
  <div class="list"></div>
</section>
</body>
</html>
